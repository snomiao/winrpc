[package]
name = "winrpc"
version = "0.0.0"
edition = "2021"
description = "Windows desktop automation RPC server — AHK v2 eval, PowerShell execution, screenshot, and cross-process UI lock."

[[bin]]
name = "winrpc"
path = "src/main.rs"

# rs/src/room.rs asks Linux how much room a pipe or a socket has.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
